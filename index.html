<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>체스 봇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#fafafa;color:#262626}
.wrap{max-width:420px;margin:0 auto;padding:16px 16px 36px}
h1{text-align:center;font-size:22px}
.sub{text-align:center;color:#8e8e8e;font-size:13px;margin:6px 0 12px}
.row{display:flex;gap:8px;margin-top:8px}
.row>*{flex:1;min-width:0}
select,button{font:inherit}
select{border:1px solid #dbdbdb;border-radius:8px;padding:10px;background:#fff}
.go{padding:11px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700}
.go.ghost{background:#fff;color:#111;border:1px solid #dbdbdb}
#board{width:100%;aspect-ratio:1;margin-top:14px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:2px solid #111;overflow:hidden;border-radius:4px}
.sq{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7.2vw,42px);line-height:1;cursor:pointer;user-select:none}
.lt{background:#eed7b0}.dk{background:#b58863}
.sq.on{box-shadow:inset 0 0 0 3px #111}
.sq.go{background-image:radial-gradient(circle,#111 18%,transparent 20%)}
.sq.cap{box-shadow:inset 0 0 0 3px #c0392b}
#msg,#hint{margin-top:10px;text-align:center;font-weight:700}
#hint{font-weight:600;font-size:14px;color:#555}
#rep{display:none;margin-top:12px;border:1px solid #dbdbdb;border-radius:12px;padding:14px;background:#fff}
#rep h3{text-align:center;margin-bottom:8px}
#rep p{font-size:14px;color:#555;line-height:1.55;margin:4px 0}
.warn{margin-top:14px;font-size:12px;color:#8e8e8e;text-align:center}
#splash{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#splash h2{font-size:36px}#splash p{color:#8e8e8e;margin:10px 0 24px}
#splash .go{min-width:220px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
<div id="splash"><h2>CHESS</h2><p>봇과 한 판</p><button class="go" type="button" onclick="document.getElementById('splash').style.display='none'">시작하기</button></div>
<div class="wrap">
<h1>체스 봇</h1>
<p class="sub">수 평가는 위치·교환까지 봅니다.</p>
<div class="row">
<select id="side"><option value="w">내가 백</option><option value="b">내가 흑</option></select>
<select id="lv"><option value="1">레이팅 100</option><option value="2" selected>레이팅 200</option><option value="3">레이팅 500</option></select>
</div>
<div class="row">
<button class="go" type="button" onclick="newGame()">새 대국</button>
<button class="go ghost" type="button" onclick="undoMove()">무르기</button>
</div>
<div id="board"></div>
<p id="msg"></p>
<p id="hint"></p>
<div id="rep"></div>
<p class="warn">프로 엔진은 아닙니다. 큰 실수 위주로 보세요.</p>
</div>
<script>
const PIECE={p:"♟",n:"♞",b:"♝",r:"♜",q:"♛",k:"♚",P:"♙",N:"♘",B:"♗",R:"♖",Q:"♕",K:"♔"};
const MAT={p:100,n:320,b:330,r:500,q:900,k:0};
const PST={
p:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
n:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
b:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],
r:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],
q:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],
k:[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20]
};
let game,me="w",sel=null,busy=false,log=[];
function sqName(r,c){return "abcdefgh"[c]+(8-r)}
function idx(r,c,w){return w?r*8+c:(7-r)*8+(7-c)}
function evalPos(g){
  const b=g.board();let s=0,wm=0,bm=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const p=b[r][c];if(!p)continue;
    const v=MAT[p.type]+(PST[p.type]?PST[p.type][idx(r,c,p.color==="w")]:0);
    if(p.color==="w"){s+=v;if(p.type!=="k")wm+=MAT[p.type]}else{s-=v;if(p.type!=="k")bm+=MAT[p.type]}
  }
  const mob=g.moves().length;
  const turn=g.turn()==="w"?1:-1;
  s+=turn*Math.min(40,mob);
  if(g.in_check())s+=turn*-18;
  return s;
}
function qsearch(g,a,b,d){
  const stand=evalPos(g);
  if(d<=0)return stand;
  if(stand>=b)return b;
  if(stand>a)a=stand;
  const caps=g.moves({verbose:true}).filter(m=>m.captured).slice(0,12);
  for(const m of caps){
    g.move(m);
    const v=qsearch(g,a,b,d-1);
    g.undo();
    if(v>=b)return b;
    if(v>a)a=v;
  }
  return a;
}
function ordered(g){
  return g.moves({verbose:true}).sort((x,y)=>(y.captured?MAT[y.captured]||0:0)+(y.flags.includes("c")?50:0)-(x.captured?MAT[x.captured]||0:0));
}
function search(g,depth,amax,a,b){
  if(g.in_checkmate())return amax?-30000-depth:30000+depth;
  if(g.in_draw())return 0;
  if(depth<=0)return qsearch(g,a,b,3);
  const ms=ordered(g);
  if(amax){
    let best=-1e9;
    for(const m of ms){g.move(m);best=Math.max(best,search(g,depth-1,false,a,b));g.undo();a=Math.max(a,best);if(b<=a)break}
    return best;
  }
  let best=1e9;
  for(const m of ms){g.move(m);best=Math.min(best,search(g,depth-1,true,a,b));g.undo();b=Math.min(b,best);if(b<=a)break}
  return best;
}
function develop(m){
  const n=game.history().length;
  if(n>12)return false;
  if(/^[NBnb]/.test(m.san)||m.san==="O-O"||m.san==="O-O-O")return true;
  if(/^e[34]$|^d[34]$|^c[34]$|^e[56]$|^d[56]$/.test(m.san))return true;
  return false;
}
function tag(cpl,openOk){
  if(openOk&&cpl<140)return["전개","초반 전개로 문제 없는 수입니다."];
  if(cpl<40)return["베스트","엔진이 고를 만한 수입니다."];
  if(cpl<90)return["괜찮음","거의 비슷한 수입니다."];
  if(cpl<160)return["부정확","조금 더 나은 수가 있습니다."];
  if(cpl<280)return["놓침","이득이나 기물을 놓쳤을 수 있습니다."];
  return["블런더","크게 손해가 나는 수입니다."];
}
function judge(from,to){
  const depth=Math.max(2,+document.getElementById("lv").value);
  const amax=game.turn()==="w";
  const ms=ordered(game);
  let bestS=-1e9,bestSan="?",playS=null,playSan="",playM=null;
  for(const m of ms){
    game.move(m);
    const raw=search(game,depth-1,!amax,-1e9,1e9);
    game.undo();
    const s=amax?raw:-raw;
    if(s>bestS+8){bestS=s;bestSan=m.san}
    else if(Math.abs(s-bestS)<=8&&m.from===from&&m.to===to){bestSan=m.san;bestS=Math.max(bestS,s)}
    if(m.from===from&&m.to===to){playS=s;playSan=m.san;playM=m}
  }
  let cpl=Math.max(0,bestS-(playS==null?bestS:playS));
  const openOk=playM&&develop(playM);
  if(openOk)cpl=Math.min(cpl,80);
  const [kind,why]=tag(cpl,openOk);
  return {san:playSan||"?",best:bestSan,cpl:Math.round(cpl),kind,why};
}
function render(){
  const flip=me==="b",box=document.getElementById("board");
  box.innerHTML="";
  const marks=sel?game.moves({square:sel,verbose:true}):[];
  const dest=new Set(marks.map(m=>m.to));
  const caps=new Set(marks.filter(m=>m.captured).map(m=>m.to));
  for(let i=0;i<64;i++){
    const r=flip?7-Math.floor(i/8):Math.floor(i/8);
    const c=flip?7-(i%8):i%8;
    const name=sqName(r,c),p=game.get(name);
    const d=document.createElement("div");
    d.className="sq "+((r+c)%2?"dk":"lt");
    if(sel===name)d.classList.add("on");
    if(dest.has(name))d.classList.add(caps.has(name)?"cap":"go");
    d.textContent=p?PIECE[p.color==="w"?p.type.toUpperCase():p.type]:"";
    d.onclick=()=>tap(name);
    box.appendChild(d);
  }
  let t="";
  if(game.in_checkmate())t=game.turn()===me?"체크메이트 · 패":"체크메이트 · 승";
  else if(game.in_draw())t="무승부";
  else t=(game.turn()===me?"내 차례":"다음 수 생각 중")+(game.in_check()?" · 체크":"");
  document.getElementById("msg").textContent=t;
  if(game.game_over())showRep();else document.getElementById("rep").style.display="none";
}
function showRep(){
  const acc=log.length?Math.round(log.reduce((s,x)=>s+(x.cpl<40?100:x.cpl<90?88:x.cpl<160?65:x.cpl<280?40:15),0)/log.length):0;
  const bad=log.filter(x=>x.cpl>=90&&x.kind!=="전개");
  let html="<h3>대국 평</h3><p>"+document.getElementById("msg").textContent+" · 정확도 "+acc+"%</p>";
  html+="<p>베스트 "+log.filter(x=>x.cpl<40).length+" · 부정확 "+log.filter(x=>x.kind==='부정확').length+" · 실수 "+log.filter(x=>x.kind==='실수').length+" · 블런더 "+log.filter(x=>x.kind==='블런더').length+"</p>";
  if(bad.length){
    html+="<p><b>아쉬운 수</b></p>";
    bad.forEach((x,i)=>{html+="<p>"+(i+1)+". "+x.san+" → "+x.kind+" (약 "+x.cpl+"cp). 추천 "+x.best+". "+x.why+"</p>"});
  }else html+="<p>큰 실수로 표시된 수가 없습니다.</p>";
  document.getElementById("rep").style.display="block";
  document.getElementById("rep").innerHTML=html;
}
function tap(name){
  if(busy||game.game_over()||game.turn()!==me)return;
  if(sel){
    const mv=game.moves({square:sel,verbose:true}).find(m=>m.to===name);
    if(mv){
      busy=true;
      const j=judge(sel,name);
      game.move({from:sel,to:name,promotion:"q"});
      log.push(j);
      document.getElementById("hint").textContent=j.kind+" · "+j.san+(j.kind==="베스트"||j.kind==="괜찮음"||j.kind==="전개"?"":" / 추천 "+j.best);
      sel=null;busy=false;render();
      if(!game.game_over())setTimeout(botMove,50);
      return;
    }
  }
  const p=game.get(name);
  sel=(p&&p.color===me)?name:null;
  render();
}
function botMove(){
  if(game.game_over()||game.turn()===me)return;
  busy=true;document.getElementById("msg").textContent="봇 생각 중";
  setTimeout(()=>{
    const depth=+document.getElementById("lv").value,amax=game.turn()==="w";
    const ms=ordered(game);
    let best=null,bestS=amax?-1e9:1e9;
    for(const m of ms){
      game.move(m);
      const s=search(game,depth-1,!amax,-1e9,1e9);
      game.undo();
      if(amax?s>bestS:s<bestS){bestS=s;best=m}
    }
    if(best)game.move({from:best.from,to:best.to,promotion:best.promotion||"q"});
    busy=false;render();
  },30);
}
function newGame(){
  game=new Chess();sel=null;busy=false;log=[];
  me=document.getElementById("side").value;
  document.getElementById("hint").textContent="";
  document.getElementById("rep").style.display="none";
  render();
  if(me==="b")setTimeout(botMove,200);
}
function undoMove(){
  if(busy||!game.history().length)return;
  game.undo();if(game.turn()!==me&&game.history().length)game.undo();
  if(log.length)log.pop();
  document.getElementById("hint").textContent="";
  sel=null;render();
}
newGame();
</script>
</body>
</html>
